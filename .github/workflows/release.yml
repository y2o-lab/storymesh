name: Release npm

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      bootstrap_stage:
        description: Stage the first release using NPM_TOKEN; approve all six packages on npmjs.com
        type: boolean
        default: false

concurrency:
  group: release-npm
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Validate release version and npm package metadata
        shell: bash
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            node scripts/check-npm-version.mjs "${GITHUB_REF_NAME#v}"
          else
            node scripts/check-npm-version.mjs
          fi
          node --test npm/test/*.test.cjs
          node scripts/check-npm-packages.mjs

  build:
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            target: aarch64-apple-darwin
            package: storymesh-darwin-arm64
            binary: storymesh
          - runner: macos-15-intel
            target: x86_64-apple-darwin
            package: storymesh-darwin-x64
            binary: storymesh
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            package: storymesh-linux-arm64
            binary: storymesh
          - runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            package: storymesh-linux-x64
            binary: storymesh
          - runner: windows-latest
            target: x86_64-pc-windows-msvc
            package: storymesh-win32-x64
            binary: storymesh.exe
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.target }}
      - name: Build release binary
        run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Upload release binary
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.package }}
          path: target/${{ matrix.target }}/release/${{ matrix.binary }}
          if-no-files-found: error

  publish:
    needs: build
    if: github.event_name == 'push' && github.ref_type == 'tag'
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Check npm trusted publishing support
        run: |
          npm --version
          node -e "const { execFileSync } = require('node:child_process'); const [major, minor, patch] = execFileSync('npm', ['--version'], { encoding: 'utf8' }).trim().split('.').map(Number); if (major < 11 || (major === 11 && (minor < 5 || (minor === 5 && patch < 1)))) process.exit(1)"
      - name: Prepare package tarballs
        run: node scripts/npm-packages.mjs artifacts release-npm
      - name: Publish platform packages, then the CLI package
        run: node scripts/publish-npm-packages.mjs release-npm

  bootstrap-stage:
    needs: build
    if: github.event_name == 'workflow_dispatch' && inputs.bootstrap_stage && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Check npm staging support
        run: |
          npm --version
          node -e "const { execFileSync } = require('node:child_process'); const [major, minor] = execFileSync('npm', ['--version'], { encoding: 'utf8' }).trim().split('.').map(Number); if (major < 11 || (major === 11 && minor < 15)) process.exit(1)"
      - name: Prepare package tarballs
        run: node scripts/npm-packages.mjs artifacts release-npm
      - name: Stage packages for approval on npmjs.com
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [[ -z "$NODE_AUTH_TOKEN" ]]; then
            echo "Set the npm Environment secret NPM_TOKEN to a stage-only granular token (Bypass 2FA disabled)."
            exit 1
          fi
          node scripts/publish-npm-packages.mjs release-npm --stage

  github-release:
    needs: [publish, bootstrap-stage]
    if: >-
      always() && !cancelled() &&
      (needs.publish.result == 'success' || needs.bootstrap-stage.result == 'success')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Create release notes or publish the existing draft
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_DRAFT: ${{ needs.bootstrap-stage.result == 'success' }}
        run: node scripts/github-release.mjs
