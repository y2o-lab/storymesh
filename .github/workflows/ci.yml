name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 26
      - name: Check Cargo and npm version synchronization
        run: node scripts/check-npm-version.mjs
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Install mise
        uses: jdx/mise-action@v5
      - name: Verify
        env:
          STORYMESH_FIXTURE_INSTALL: '1'
          STORYMESH_FIXTURE_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: mise run verify
