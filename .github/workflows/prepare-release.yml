name: Prepare npm release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version, for example 0.3.0 or 0.3.0-rc.1 (without v)'
        type: string
        required: true

concurrency:
  group: prepare-npm-release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      RELEASE_VERSION: ${{ inputs.version }}
    steps:
      - name: Require main
        run: test "$GITHUB_REF" = refs/heads/main
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 26
      - name: Validate requested version
        run: |
          node --input-type=module <<'NODE'
          import { distTagForVersion } from './scripts/npm-release-version.mjs';
          import { validatePackageVersions } from './scripts/npm-packages.mjs';
          const version = process.env.RELEASE_VERSION;
          distTagForVersion(version);
          if (version === await validatePackageVersions()) {
            throw new Error('Choose a new release version; this version is already in the manifests');
          }
          NODE
          if git show-ref --verify --quiet "refs/tags/v$RELEASE_VERSION"; then
            echo 'Release tag already exists; choose a new version' >&2
            exit 1
          fi
          release_refs=$(git ls-remote --heads origin "refs/heads/release/v$RELEASE_VERSION")
          if test -n "$release_refs"; then
            echo 'Release branch already exists; review it before preparing another release' >&2
            exit 1
          fi
      - name: Synchronize Cargo and npm versions
        run: |
          git switch -c "release/v$RELEASE_VERSION"
          node scripts/set-version.mjs "$RELEASE_VERSION"
          node scripts/check-npm-version.mjs "$RELEASE_VERSION"
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - uses: jdx/mise-action@v5
      # GITHUB_TOKEN pushes do not trigger CI; verify before publishing the branch.
      - name: Verify release changes
        run: mise run verify
      - name: Commit release preparation branch
        run: |
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Cargo.toml Cargo.lock npm/storymesh/package.json npm/platforms/*/package.json
          git commit -m "chore: prepare v$RELEASE_VERSION"

      - name: Push release preparation branch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git -c http.extraheader="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GITHUB_TOKEN" | base64 -w0)" push origin "HEAD:refs/heads/release/v$RELEASE_VERSION"
          echo "Prepared release/v$RELEASE_VERSION. Open a pull request into main, verify CI, then tag the merged commit as v$RELEASE_VERSION." >> "$GITHUB_STEP_SUMMARY"
