[package]
name = "storymesh"
version = "0.1.0-alpha.1"
edition = "2024"
rust-version = "1.85"
description = "Audit Storybook story coverage and report gaps."
license = "MIT"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
ignore = "0.4"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
serde_yaml = "0.9.34"
